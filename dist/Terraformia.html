  <style>
:root {

* { box-sizing: border-box; }

body { margin: 0; color: var(--ink); background: var(--bg); height: 100vh; height: 100dvh; display: grid; grid-template-rows: 64px minmax(0,1fr) 41px; overflow: hidden; }
button, select { font: inherit; }
button { appearance: none; color: inherit; border: 1px solid transparent; cursor: pointer; }

[data-marker="build"] { --marker:#a5f0c1; }

.mission-guide[data-marker="build"] { --marker:#a5f0c1; }

.warning { position: absolute; top: 55px; right:12px; left:auto; z-index:2; width:min(286px,calc(100% - 24px)); padding: 10px 12px; border-radius: 6px; border: 1px solid #eea1819a; background: #38251df5; color: #ffd1b5; font-size: 12px; font-weight: 700; box-shadow: 0 6px 16px #20171059; text-align: center; pointer-events: none; }

.achievement { position:absolute; right:12px; top:55px; z-index:3; display:flex; align-items:center; gap:10px; max-width:250px; padding:10px 12px; color:#fff2cc; background:#303026f5; border:1px solid #e5c98e; border-left:3px solid #e5c98e; box-shadow:0 6px 24px #15151773; border-radius:7px; pointer-events:none; animation:award-in .22s ease-out both; }

  const countRooms = (base, type) => base.buildings.filter(item => item.room?.type === type);
  const hasType = (base, type) => base.buildings.some(item => item.type === type);
  const manhattan = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
  const entityDist = (rover, item) => Math.hypot(rover.x - item.x - 0.5, rover.y - item.y - 0.5);
  const bypassPower = entry => entry.override === "off";
  const solarPower = (base, panel, conditions) => conditions.night ? 0 :
    SITES[base.id].solar * (conditions.storm ? 0.4 : panel.dirty ? 0.75 : 1);
  const byId = (state, id) => state.bases.find(base => base.id === id);
  const city = state => state.bases[0];
  const existsBase = (state, id) => state.bases.some(base => base.id === id);

  function makeBase(id) {
    return {
      id, stock: STOCK(), buildings: [], temp: 12, charge: 0, auto: false,
      priority: "greenhouse", supply: true, telemetry: { generation:0, load:0, demand:0, capacity:0, heat:false, life:false }
    };
  }

  function newGame() {
    const base = makeBase("city");
    base.stock.parts = 18;
    return {
      format: SAVE_FORMAT, elapsed: 0, nextId: 1, chapter: 1, bases: [base],
      rover: { x:11.5, y:17.25, cargo:{ ice:0, ore:0 }, angle:-Math.PI/2 },
      kit: { solar:1, refinery:1 }, drones: [], padStock: STOCK(), explored: [],
      selectedSite: null, trial: null, firstResult: null, finalResult: null,
      crew: false, logistics: false, log: [], eventSerial: 0
    };
  }

  function signal(state, kind, text, baseId = null) {
    state.log.unshift({ id: ++state.eventSerial, time: state.elapsed, kind, text, baseId });
    if (state.log.length > 48) state.log.length = 48;
  }

  function weather(state, time = state.elapsed) {
    const clock = time % SOL;
    const trial = state.trial;
    const scheduled = trial && time + EPS >= trial.warn && time < trial.start - EPS && trial.phase !== "failed";
    const storm = Boolean(trial && time + EPS >= trial.start && time < trial.stormEnd - EPS);
    return {
      clock, sol:Math.floor(time / SOL) + 1, night:clock >= DAY - EPS, storm,
      forecast: scheduled ? trial.start - time : null,
      sunset: clock < DAY ? DAY - clock : null,
      sunrise: SOL - clock,
      outside: clock < DAY ? Math.round(-36 + 15 * Math.sin(Math.PI * clock / DAY)) :
        Math.round(-42 - 29 * Math.sin(Math.PI * (clock - DAY) / (SOL - DAY)))
    };
  }

  function getPlace(state, x, y) {
    if (SITES.city.x === x && SITES.city.y === y) return { kind:"depot", base:city(state), item:SITES.city };
    if (PAD.x === x && PAD.y === y) return { kind:"pad", item:PAD };
    const deposit = DEPOSITS.find(item => item.x === x && item.y === y);
    if (deposit) return { kind:"deposit", item:deposit };
    for (const base of state.bases) {
      if (base.id !== "city" && x === SITES[base.id].x && y === SITES[base.id].y) {
        return { kind:"depot", base, item:SITES[base.id] };
      }
      const building = base.buildings.find(item => item.x === x && item.y === y);
      if (building) return { kind:"building", base, item:building };
    }
    const site = Object.values(SITES).find(item => item.id !== "city" && item.x === x && item.y === y);
    return site ? { kind:"site", item:site } : null;
  }

  function location(id) {
    return id === "pad" ? PAD : SITES[id];
  }

  function localDepot(state, id) {
    if (id === "pad") return state.crew ? state.padStock : null;
    return byId(state, id)?.stock || null;
  }

  function accessibleDeposit(state, deposit) {
    return deposit.site === "city" || (state.chapter >= 3 && state.selectedSite === deposit.site);
  }

  function costOf(state, base, type) {
    return base.id === "city" && state.kit[type] ? 0 : TYPES[type].cost;
  }

  function checkBuild(state, type, x, y) {
    if (!TYPES[type] || !Number.isInteger(x) || !Number.isInteger(y)) return { message:"Выбери клетку строительства." };
    if (type === "insulation" && !state.crew) return { message:"Утепление откроется после посадки экипажа." };
    const base = state.bases.find(candidate => {
      const [a,b,c,d] = SITES[candidate.id].bounds;
      return x >= a && y >= b && x <= c && y <= d;
    });
    if (!base) return { message:"Постройка должна находиться в зоне действующего склада." };
    const place = getPlace(state, x, y);
    if (["greenhouse","habitat","insulation"].includes(type)) {
      if (place?.item.type !== "sector") return { message:"Выбери герметичный сектор." };
      if (type === "insulation" ? place.item.insulated : place.item.room) return {
        message:type === "insulation" ? "Сектор уже утеплён." : "Сектор уже занят."
      };
    } else {
      if (place) return { message:"Клетка занята." };
      if (type === "sector") {
        const sectors = base.buildings.filter(item => item.type === "sector");
        const neighbors = sectors.length ? sectors : [SITES[base.id]];
        if (!neighbors.some(item => manhattan({x,y}, item) === 1)) {
          return { message:sectors.length ? "Присоедини сектор к существующему." : "Поставь первый сектор рядом со складом." };
        }
      }
    }
    if (entityDist(state.rover, {x,y}) > REACH) return { message:"Подведи ровер ближе." };
    const cost = costOf(state, base, type);
    if (!enough(base.stock.parts, cost)) return { message:`Нужно ${cost} дет., на складе ${Math.floor(base.stock.parts)}.` };
    return { base, place, cost };
  }

  function build(state, type, x, y) {
    const checked = checkBuild(state, type, x, y);
    if (checked.message) return bad(checked.message);
    const { base, place, cost } = checked;
    if (cost === 0) state.kit[type]--;
    else base.stock.parts -= cost;
    if (type === "insulation") place.item.insulated = true;
    else if (type === "habitat" || type === "greenhouse") {
      place.item.room = { type, occupied:false, enabled:true, override:null, powered:false, progress:0, input:null };
    } else {
      base.buildings.push({
        id:state.nextId++, x, y, type, dirty:false, insulated:false, room:null,
        enabled:true, powered:false, override:null, mode:"auto", progress:0, input:null
      });
    }
    return good(`${TYPES[type].name} · готово`);
  }

  function good(message, extra) {
    return { ok:true, message, ...extra };
  }

  function bad(message) {
    return { ok:false, message };
  }

  function commandsFor(base) {
    if (base.priority === "refinery") return [...base.buildings.filter(item => item.type === "refinery"), ...countRooms(base, "greenhouse").map(item => item.room)];
    return [...countRooms(base, "greenhouse").map(item => item.room), ...base.buildings.filter(item => item.type === "refinery")];
  }

  function criticalLoad(base, night) {
    const sectors = base.buildings.filter(item => item.type === "sector");
    const heat = sectors.reduce((sum, item) => sum + (night && !item.insulated ? 2 : 1), 0);
    const life = countRooms(base, "habitat").filter(item => item.room.enabled).length * 2;
    return { heat, life };
  }

  function feedFor(stock, item) {
    if (item.type === "greenhouse") return enough(stock.water, 1) ? "water" : null;
    if (item.mode === "ice" || item.mode === "ore") return enough(stock[item.mode], 1) ? item.mode : null;
    if (enough(stock.ice, 1) && (stock.water < 8 || !enough(stock.ore, 1))) return "ice";
    if (enough(stock.ore, 1)) return "ore";
    return enough(stock.ice, 1) ? "ice" : null;
  }

  function runnable(base, item) {
    return item.enabled && (item.type !== "greenhouse" || base.temp + EPS >= SAFE_TEMP) &&
      Boolean(item.input || feedFor(base.stock, item));
  }

  function generation(base, conditions) {
    return base.buildings.reduce((sum, item) => sum + (item.type === "solar" ? solarPower(base, item, conditions) : 0), 0);
  }

  function capacity(base) {
    return base.buildings.filter(item => item.type === "battery").length * CAPACITY;
  }

  function runProduction(base, item, dt) {
    if (!item.input) {
      const input = feedFor(base.stock, item);
      if (!input) return;
      base.stock[input] = Math.max(0, base.stock[input] - 1);
      item.input = input;
      item.progress = 0;
    }
    const threshold = item.type === "greenhouse" ? 30 : 5;
    item.progress += dt;
    if (item.progress + EPS < threshold) return;
    if (item.type === "greenhouse") base.stock.food += 2;
    else if (item.input === "ice") base.stock.water += 1;
    else base.stock.parts += 1;
    item.input = null;
    item.progress = 0;
    return true;
  }

  function balanceBase(base, conditions, dt, events) {
    const produced = generation(base, conditions);
    const cap = capacity(base);
    const demands = criticalLoad(base, conditions.night);
    const minute = dt / 60;
    const energy = produced * minute + base.charge;
    let remaining = energy;
    let load = 0;
    let demand = demands.life + demands.heat;
    function allocate(rate) {
      const cost = rate * minute;
      if (!enough(remaining, cost)) return false;
      remaining = Math.max(0, remaining - cost);
      load += rate;
      return true;
    }

    const rooms = countRooms(base, "habitat");
    for (const entry of rooms) entry.room.powered = entry.room.enabled && allocate(2);
    const heat = demands.heat > 0 && allocate(demands.heat);
    const partialCritical = load + EPS < demands.life + demands.heat;
    for (const item of commandsFor(base)) {
      const wantsPower = runnable(base, item) && !bypassPower(item);
      if (wantsPower) demand += 2;
      item.powered = wantsPower && !partialCritical && allocate(2);
      if (item.powered && runProduction(base, item, dt)) {
        events.push(item.type === "greenhouse" ? "harvest" : "refine");
      }
    }
    // Use any fractional energy in the final simulation step of a depleted battery.
    if (partialCritical) remaining = 0;
    base.charge = Math.min(cap, remaining);
    if (demands.heat) {
      const rate = heat ? 3 : conditions.night ? -4 : -1;
      base.temp = Math.min(TARGET_TEMP, Math.max(-80, base.temp + rate * minute));
    }
    const occupied = rooms.filter(item => item.room.occupied);
    const consumption = occupied.length * minute;
    base.supply = enough(base.stock.water, consumption) && enough(base.stock.food, consumption);
    base.stock.water = Math.max(0, base.stock.water - consumption);
    base.stock.food = Math.max(0, base.stock.food - consumption);
    const life = rooms.length > 0 && rooms.every(item => item.room.powered || (!item.room.occupied && occupied.length > 0));
    base.telemetry = { generation:produced, load, demand, capacity:cap, heat, life };
  }

  function energyProjection(base, state, activeCount, reserveHours = 0) {
    const end = (Math.floor(state.elapsed / SOL) + 1) * SOL;
    const cap = capacity(base);
    let charge = base.charge;
    let lowest = charge;
    let temp = base.temp;
    for (let time = state.elapsed; time < end - EPS; time += 1) {
      const dt = Math.min(1, end - time) / 60;
      const conditions = weather(state, time);
      const critical = criticalLoad(base, conditions.night);
      const needed = critical.life + critical.heat + 2 * activeCount;
      const produced = generation(base, conditions);
      const relief = charge + (produced - needed) * dt;
      lowest = Math.min(lowest, relief);
      charge = Math.min(cap, relief);
      temp = charge >= 0 || produced >= critical.heat + critical.life ?
        Math.min(TARGET_TEMP, temp + 3 * dt) : temp - (conditions.night ? 4 : 1) * dt;
      if (charge < -EPS) return { safe:false, lowest, temp };
    }
    return { safe:lowest >= reserveHours - EPS, lowest, temp };
  }

  function runAlex(base, state) {
    if (!base.auto || !state.crew) return;
    const refineries = base.buildings.filter(item => item.type === "refinery");
    const farms = countRooms(base, "greenhouse").map(item => item.room);
    const running = () => [...refineries, ...farms].filter(item => runnable(base, item) && !bypassPower(item)).length;
    let count = running();
    let budget = energyProjection(base, state, count);
    const siteName = SITES[base.id].name;
    const endangered = budget.temp < SAFE_TEMP && base.temp >= SAFE_TEMP;
    if (!budget.safe || endangered) {
      for (const item of [...refineries, ...farms]) {
        if (!runnable(base, item) || bypassPower(item)) continue;
        item.override = "off";
        const label = item.type === "refinery" ? "переработчик" : "теплицу";
        signal(state, "alex", `${siteName} · Приостановил ${label}: текущего резерва не хватает до рассвета.`, base.id);
        budget = energyProjection(base, state, --count);
        if (budget.safe) break;
      }
      return;
    }
    // Give food production first use of a recovered reserve and leave a small margin.
    for (const item of [...farms, ...refineries]) {
      if (!item.enabled || !bypassPower(item) || !runnable(base, item)) continue;
      if (!energyProjection(base, state, count + 1, 0.8).safe) continue;
      item.override = null;
      count++;
      const label = item.type === "refinery" ? "переработчик" : "теплицу";
      signal(state, "alex", `${siteName} · Вернул ${label} в работу: запас энергии восстановлен.`, base.id);
    }
  }

  function durations(origin, destination) {
    return Math.max(3, Math.hypot(origin.x - destination.x, origin.y - destination.y) / 2.8);
  }

  function droneEndpoints(drone) {
    const route = drone.route;
    const source = drone.kind === "mine" ? DEPOSITS.find(item => item.id === route.source) : location(route.source);
    return { from:source, to:location(route.target) };
  }

  function deployOutpost(state, siteId) {
    if (!existsBase(state, siteId)) {
      state.bases.push(makeBase(siteId));
      signal(state, "story", `${SITES[siteId].name} · Груз доставлен, склад развёрнут.`, siteId);
    }
    return byId(state, siteId);
  }

  function tickDrones(state, conditions, dt, events) {
    for (const drone of state.drones) {
      if (!drone.route || conditions.storm || drone.paused) continue;
      const { from, to } = droneEndpoints(drone);
      const route = drone.route;
      const flightTime = durations(from, to);
      if (drone.phase === "recall") {
        drone.progress = Math.max(0, drone.progress - dt);
        if (drone.progress <= EPS) {
          drone.phase = "ready";
          drone.paused = true;
        }
        continue;
      }
      if (drone.phase === "ready") {
        if (drone.cargo > 0) {
          drone.phase = "deliver";
          continue;
        }
        const source = drone.kind === "cargo" ? localDepot(state, route.source) : null;
        const count = drone.kind === "mine" ? CARGO_CAP : Math.min(CARGO_CAP, Math.floor((source?.[route.resource] || 0) + EPS));
        if (count < 1) continue;
        if (source) source[route.resource] = Math.max(0, source[route.resource] - count);
        drone.cargo = count;
        drone.phase = "deliver";
        drone.progress = 0;
        state.logistics = true;
      }
      drone.progress = Math.min(flightTime, drone.progress + dt);
      if (drone.progress + EPS < flightTime) continue;
      drone.progress = 0;
      if (drone.phase === "deliver") {
        let destination = localDepot(state, route.target);
        if (!destination && route.target === state.selectedSite && state.chapter >= 3) {
          destination = deployOutpost(state, route.target).stock;
        }
        if (!destination) {
          drone.paused = true;
          continue;
        }
        destination[route.resource] += drone.cargo;
        if (!drone.reported) {
          signal(state, "system", `${location(route.target).name} · Первый рейс доставил груз.`, route.target);
          drone.reported = true;
          events.push("delivery");
        }
        drone.cargo = 0;
        drone.phase = "return";
      } else if (drone.phase === "return") {
        drone.phase = "ready";
      }
    }
  }

  function dronePosition(drone) {
    if (!drone.route) {
      const loc = location(drone.home);
      return { x:loc.x+0.5, y:loc.y+0.4 };
    }
    const { from, to } = droneEndpoints(drone);
    const ratio = Math.min(1, drone.progress / durations(from, to));
    const t = drone.phase === "return" ? 1 - ratio : drone.phase === "ready" ? 0 : ratio;
    return { x:from.x+0.5 + (to.x - from.x) * t, y:from.y+0.5 + (to.y - from.y) * t };
  }

  function prepFirst(state) {
    const base = city(state);
    return [
      { label:"Разверни солнечную панель и переработчик", done:hasType(base,"solar") && hasType(base,"refinery") },
      { label:"Поставь аккумулятор", done:hasType(base,"battery") },
      { label:"Построй теплицу и жилой отсек в секторах", done:countRooms(base,"greenhouse").length > 0 && countRooms(base,"habitat").length > 0 },
      { label:"Прогрей купол до +16 °C", done:base.temp + EPS >= SAFE_TEMP },
      { label:"Запаси по 2 ед. воды и пищи", done:enough(base.stock.water,2) && enough(base.stock.food,2) }
    ];
  }

  function assess(base, first = false) {
    if (!base.telemetry.life) return "отказ питания жизнеобеспечения";
    if (!enough(base.temp, SAFE_TEMP)) return "температура купола ниже +16 °C";
    if (!first && !base.supply) return "закончилась вода или пища";
    return null;
  }

  function markDirty(state) {
    for (const base of state.bases) {
      for (const item of base.buildings) if (item.type === "solar") item.dirty = true;
    }
  }

  function advanceChapter(state, events) {
    const base = city(state);
    if (state.chapter === 2) {
      const occupied = countRooms(base, "habitat").filter(item => item.room.occupied).length;
      const farms = countRooms(base, "greenhouse").filter(item => item.room.powered).length;
      if (occupied >= 2 && farms >= 2 && state.logistics) {
        state.chapter = 3;
        signal(state, "story", "Город готов. Обследуй низину и плато, затем выбери площадку для второго поселения.", "city");
        events.push("chapter");
      }
    } else if (state.chapter === 3 && state.selectedSite) {
      const outpost = byId(state, state.selectedSite);
      if (outpost && countRooms(outpost,"habitat").some(item => item.room.occupied) &&
          countRooms(outpost,"greenhouse").length > 0 && outpost.telemetry.life && enough(outpost.temp,SAFE_TEMP) &&
          hasType(outpost,"solar") && hasType(outpost,"battery")) {
        state.chapter = 4;
        signal(state, "story", "Обе колонии заселены. Пополни запасы и назначь финальное испытание.");
        events.push("chapter");
      }
    }
  }

  function scheduleTrial(state) {
    if (state.finalResult) return bad("Кампания уже завершена.");
    if (state.trial) return bad("Испытание уже назначено.");
    if (state.chapter !== 1 && state.chapter !== 4) return bad("Испытание пока недоступно.");
    const first = state.chapter === 1;
    if (first && prepFirst(state).slice(0,4).some(item => !item.done)) return bad("Сначала подготовь и прогрей первый купол.");
    const stormAt = first ? FIRST_STORM : FINAL_STORM;
    let warnAt = Math.floor(state.elapsed / SOL) * SOL + stormAt - FORECAST;
    if (warnAt < state.elapsed - EPS) warnAt += SOL;
    const start = warnAt + FORECAST;
    const end = Math.floor(start / SOL) * SOL + SOL;
    state.trial = { kind:first?"first":"final", phase:"scheduled", warn:warnAt, start, stormEnd:first?start+STORM_LENGTH:end, end, failure:null, cleared:false };
    if (first) state.firstResult = null;
    return good("Испытание назначено. На панели появится прогноз.");
  }

  function trialAdvance(state, events) {
    const trial = state.trial;
    if (!trial) return;
    if (trial.phase === "scheduled" && state.elapsed + EPS >= trial.warn) {
      trial.phase = "warning";
      const first = trial.kind === "first";
      signal(state, first ? "alex" : "urgent", first ?
        "Алекс с орбиты · Буря через минуту. Проверь заряд и оставь питание отоплению и жилому отсеку." :
        "Штормовое предупреждение · Буря через минуту. Проверь обе колонии.");
      events.push("forecast");
      if (!first) events.push("checkpoint");
    }
    if (trial.phase === "warning" && state.elapsed + EPS >= trial.start) {
      trial.phase = "testing";
      signal(state, "urgent", "Пыльная буря началась. Дроны ожидают улучшения погоды.");
      events.push("storm");
    }
    if (!trial.cleared && state.elapsed + EPS >= trial.stormEnd) {
      markDirty(state);
      trial.cleared = true;
      if (trial.kind === "first") {
        signal(state, "system", "Буря прошла. На панелях осталась пыль.");
        events.push("clear");
      }
    }
  }

  function trialCheck(state, events, intervalStart) {
    const trial = state.trial;
    if (!trial || intervalStart + EPS < trial.start || intervalStart >= trial.end - EPS) return;
    const first = trial.kind === "first";
    if (first) {
      trial.failure ||= assess(city(state), true);
    } else {
      for (const base of state.bases) {
        const issue = assess(base);
        if (!issue) continue;
        trial.phase = "failed";
        state.finalResult = { success:false, base:base.id, issue };
        signal(state, "urgent", `${SITES[base.id].name} · ${issue}.`, base.id);
        events.push("defeat");
        return;
      }
    }

    if (state.elapsed + EPS < trial.end) return;
    if (!trial.cleared) markDirty(state);
    state.trial = null;
    if (first) {
      const base = city(state);
      const issue = trial.failure || (!enough(base.stock.water,2) || !enough(base.stock.food,2) ? "подготовь по 2 ед. воды и пищи" : null);
      state.firstResult = { success:!issue, issue };
      if (issue) {
        signal(state, "urgent", `Испытание не пройдено: ${issue}. Восстанови базу и назначь новую проверку.`, "city");
        events.push("setback");
        return;
      }
      countRooms(base, "habitat")[0].room.occupied = true;
      state.crew = true;
      state.chapter = 2;
      signal(state, "story", "Майя и Алекс приземлились. Открыты дроны, утепление и автоматическое управление энергией.", "city");
      events.push("landing", "chapter");
    } else {
      state.finalResult = { success:true, time:state.elapsed, colonies:state.bases.map(base => ({
        id:base.id, water:base.stock.water, food:base.stock.food, temp:base.temp, charge:base.charge
      })) };
      signal(state, "story", "Рассвет. Обе колонии выстояли. Грузовые рейсы возобновлены.");
      events.push("victory");
    }
  }

  function driveRover(rover, movement, dt) {
    const ax = Number(movement.x) || 0;
    const ay = Number(movement.y) || 0;
    const vector = Math.hypot(ax, ay);
    const speed = (movement.slow ? PRECISION_SPEED : DRIVE_SPEED) / Math.max(1, vector);
    const targetX = ax * speed;
    const targetY = ay * speed;
    const vx = Number.isFinite(rover.vx) ? rover.vx : 0;
    const vy = Number.isFinite(rover.vy) ? rover.vy : 0;
    const response = vector === 0 || movement.slow ? 24 : 17;

    // Integrate the velocity change so a short tap travels the same distance at different frame rates.
    const nextX = rover.x + targetX * dt + (vx - targetX) * blend / response;
    const nextY = rover.y + targetY * dt + (vy - targetY) * blend / response;
    rover.x = Math.min(W - 0.45, Math.max(0.45, nextX));
    rover.y = Math.min(H - 0.45, Math.max(0.45, nextY));
    rover.vx = rover.x === nextX ? vx + (targetX - vx) * blend : 0;
    rover.vy = rover.y === nextY ? vy + (targetY - vy) * blend : 0;
    if (!vector && Math.hypot(rover.vx, rover.vy) < 0.035) rover.vx = rover.vy = 0;
    if (vector > 0) {
      const current = Number.isFinite(rover.angle) ? rover.angle : 0;
      const heading = Math.atan2(ay, ax) - current;
      const turn = Math.atan2(Math.sin(heading), Math.cos(heading));

  function tick(state, dt, movement = null) {

    const reconsider = Math.floor((start + dt + EPS) / 2) !== Math.floor((start + EPS) / 2) || events.includes("checkpoint");

  function mine(state, depositId) {

    if (entityDist(state.rover,target) > REACH) return bad("Подведи ровер ближе к месторождению.");
    const free = CARGO_CAP - state.rover.cargo.ice - state.rover.cargo.ore;

  function unload(state, id) {

    if (!state.rover.cargo.ice && !state.rover.cargo.ore) return bad("Грузовой отсек пуст.");

    const active = item.room || item;
    if (command.action === "clean") {

      if (weather(state).storm) return bad("Очистка доступна после бури.");

    const supply = localDepot(state,target);

    if (!supply && !futureDepot) return bad("Выбери доступную точку назначения.");

      if (!mineSite || !accessibleDeposit(state,mineSite) || futureDepot) return bad("Выбери месторождение и действующий склад.");

        drone.paused = !drone.paused;

    }
  }

    if (state.chapter === 2) return [
      { label:"Засели два жилых отсека", done:countRooms(first,"habitat").filter(item => item.room.occupied).length >= 2 },
      { label:"Запусти две теплицы одновременно", done:countRooms(first,"greenhouse").filter(item => item.room.powered).length >= 2 },
      { label:"Отправь добывающий или грузовой дрон", done:state.logistics }

      { label:"Доставь детали для развёртывания склада", done:Boolean(next) },

  }

    if(refinery && (base.stock[type]>=1-E.EPS || refinery.input===type)) {
      if(refinery.mode!=="auto" && refinery.mode!==type && refinery.input!==type)
        return equipmentGoal(refinery,"Выбери режим переработки",type==="ice"?"В карточке цеха переключи режим на «Вода».":"В карточке цеха переключи режим на «Детали».");
      if(!refinery.enabled) return equipmentGoal(refinery,"Включи переработчик","Подъедь к цеху и включи его в карточке объекта.");
      if(refinery.powered || !E.weather(state).night && base.telemetry.generation>0)
        return goal(type==="ice"?"Получи воду":"Получи детали",`Переработчик обработает сырьё. ${type==="ore"&&refinery.mode==="auto"&&refinery.input==="ice"?"После текущего цикла можно выбрать режим «Детали». ":""}Можно ускорить ожидание ×4.`,marker(refinery,"Переработчик","production","ПЕРЕРАБОТКА"),{type:"inspect",x:refinery.x,y:refinery.y});
      return goal("Обеспечь питание цеха","Проверь панели, запас энергии и приоритет переработки.",marker(refinery,"Переработчик","production","ЦЕХ"),{type:"inspect",x:refinery.x,y:refinery.y});
    }
    const deposit=closest(state,E.DEPOSITS.filter(item=>item.type===type && item.site===base.id && E.accessibleDeposit(state,item)));
    if(deposit) return goal(type==="ice"?"Найди лёд":"Добудь руду",
      "Подъедь к отмеченной залежи, нажми E и отвези груз на склад.",marker(deposit,type==="ice"?"Лёд":"Руда",type,type==="ice"?"ДОБЫЧА ЛЬДА":"ДОБЫЧА РУДЫ"));
    return goal("Организуй снабжение","Сырьё и материалы можно доставить грузовым дроном.",marker(depot,"Склад"),{type:"drones",base:base.id});
  }

  function freightGoal(state,destination,resource) {
    const city=state.bases[0];
    const drone=state.drones.find(d=>d.kind==="cargo" && d.route?.source==="city" && d.route.target===destination && d.route.resource===resource);
    if(drone?.paused) return goal("Возобнови доставку","Открой маршрут грузового дрона и возобнови рейс.",marker(E.SITES[destination],"Пункт назначения"),{type:"drones",base:"city"});
    if(drone && (drone.cargo || city.stock[resource]>=1-E.EPS))
      return goal("Дождись доставки",`Грузовой рейс: ${E.RESOURCE_NAMES[resource].toLowerCase()}. Ускорь ожидание ×4 при ясной погоде.`,
        marker(E.SITES[destination],"Пункт назначения"),{type:"drones",base:"city"});
    const emptyCargo=state.drones.some(d=>d.kind==="cargo"&&!d.route);
    const reusable=state.drones.some(d=>d.kind==="cargo"&&!d.cargo);
    if(!drone && !emptyCargo && !reusable && !affordable(city,6)) return rawGoal(state,city,"ore");
    if(drone && city.stock[resource]<1-E.EPS && !drone.cargo)
      return resource==="parts"?rawGoal(state,city,"ore"):rawGoal(state,city,"ice");
    return goal(drone||emptyCargo||reusable?"Назначь грузовой рейс":"Собери грузовой дрон",
      `В разделе «Дроны» задай маршрут из Посадочной долины в ${E.SITES[destination].name.toLowerCase()}, груз — ${E.RESOURCE_NAMES[resource].toLowerCase()}.`,
      marker(E.SITES.city,"Склад долины"),{type:"drones",base:"city"});
  }

  function materialsGoal(state,base) {
    return base.id==="city"?rawGoal(state,base,"ore"):freightGoal(state,base.id,"parts");
  }

  function plannedCell(state,base,type) {
    const site=E.SITES[base.id];
    const [left,top,right,bottom]=site.bounds;
    const offset={solar:[-1,-1],refinery:[1,-1],battery:[-1,1],sector:[1,0]}[type]||[1,0];
    const candidates=[];
    for(let y=top;y<=bottom;y++)for(let x=left;x<=right;x++) {
      const score=(x-site.x-offset[0])**2+(y-site.y-offset[1])**2;
      // Preserve the four connections around the depot for the first sector.
      const penalty=!["sector","habitat","greenhouse","insulation"].includes(type) &&
        Math.abs(x-site.x)+Math.abs(y-site.y)===1?50:0;
      candidates.push({x,y,score:score+penalty});
    }
    candidates.sort((a,b)=>a.score-b.score);
    for(const cell of candidates) {
      const projection={...state,rover:{...state.rover,x:cell.x+.5,y:cell.y+.5}};
      if(!E.checkBuild(projection,type,cell.x,cell.y).message)return cell;
    }
    return null;
  }

  function buildingGoal(state,base,type) {
    const cost=E.costOf(state,base,type), info={type,base:base.id};
    if(!affordable(base,cost))return {...materialsGoal(state,base),requirement:info};
    const site=E.SITES[base.id];
    const titles={solar:"Поставь солнечную панель",battery:"Поставь аккумулятор",refinery:"Разверни переработчик",
      sector:"Построй герметичный сектор",greenhouse:"Размести теплицу",habitat:"Размести жилой отсек",insulation:"Утепли сектор"};
    const cell=plannedCell(state,base,type);
    if(!cell)return {...goal(titles[type],type==="sector"?"Первый сектор должен граничить со складом, следующие — с существующим сектором. Нужна свободная клетка.":"Нужна подходящая свободная клетка в зоне склада.",null,{type:"build",building:type,base:base.id}),requirement:info};
    const local=close(state,cell);
    const verbs=["greenhouse","habitat","insulation"].includes(type)?
      (local?"Выбери модуль и нажми на выделенный сектор.":"Подъедь к выделенному сектору и размести модуль."):
      (local?"Выбери постройку и нажми на отмеченную клетку.":"Подъедь к отмеченной клетке и размести модуль.");
    const tags={solar:"ПАНЕЛЬ",battery:"АККУМУЛЯТОР",refinery:"ЦЕХ",sector:"СЕКТОР",greenhouse:"ТЕПЛИЦА",habitat:"ЖИЛЬЁ",insulation:"УТЕПЛЕНИЕ"};
    return {...goal(titles[type],`${cost?cost+" дет.":"Готовый модуль из запаса"}. ${verbs}`,
      marker(cell,"Рекомендуемое место","build",tags[type]),{type:"build",building:type,base:base.id}),requirement:info};
  }

  function roomGoal(state,base,type) {
    return constructionGoal(state,base,type);
  }

  function constructionGoal(state,base,type,seekMaterials=false) {
    const r=requirements(state,base,type), info={type,base:base.id};
    if(r.locked)return {...goal("Утепление пока закрыто","Сначала пройди испытание и дождись посадки экипажа."),requirement:info};
    // One plan can cover several purchases, but a player may also build the
    // prerequisite as soon as they have enough for that first step.
    if(r.missingNext||(seekMaterials&&r.missing)) {
      const step=materialsGoal(state,base);
      return {...step,detail:`Для постройки «${E.TYPES[type].name}» нужно ещё ${r.missing} дет. ${step.detail}`,requirement:info};
    }
    const step=buildingGoal(state,base,r.next);
    if(r.needsSector&&step.shortcut?.type==="build") {
      return {...step,title:`Сначала герметичный сектор`,detail:`${E.TYPES[type].name}: нужен ${r.insulation?"неутеплённый":"свободный"} сектор. ${step.target?close(state,step.target)?"Поставь сектор в отмеченной клетке.":"Подъедь к отмеченной клетке.":step.detail}`,requirement:info};
    }
    return {...step,requirement:info};
  }

  function support(state,base) {
    const power=E.powerEstimate(state,base);
    if(power.capacity+E.EPS < power.nightLoad*(E.SOL-E.DAY)/60)return buildingGoal(state,base,"battery");
    const steady=E.SITES[base.id].solar*count(base,"solar");
    const daytimeHeat=count(base,"sector");
    const load=daytimeHeat+2*(rooms(base,"habitat").length+rooms(base,"greenhouse").length+count(base,"refinery"));
    if(steady<load)return buildingGoal(state,base,"solar");
    return null;
  }

  function waterGoal(state,base) {
    if(base.id==="plateau")return freightGoal(state,base.id,"water");
    if(!count(base,"refinery"))return buildingGoal(state,base,"refinery");
    return rawGoal(state,base,"ice");
  }

  function suppliesGoal(state,base,water,food) {
    if(base.stock.water+E.EPS<water)return waterGoal(state,base);
    if(base.stock.food+E.EPS<food) {
      const farm=rooms(base,"greenhouse").find(b=>b.room.enabled)||rooms(base,"greenhouse")[0];
      if(!farm)return roomGoal(state,base,"greenhouse");
      if(!farm.room.enabled)return equipmentGoal(farm,"Включи теплицу","Подъедь к теплице и включи производство.");
      if(base.temp<E.SAFE_TEMP-E.EPS)return goal("Прогрей купол","Теплица начинает работать при +16 °C. Проверь питание отопления.",marker(farm,"Теплица"));
      if(farm.room.override==="off" || !farm.room.powered && base.telemetry.generation<base.telemetry.demand)
        return support(state,base)||goal("Обеспечь питание теплицы","Проверь энергию и приоритет теплицы, чтобы возобновить выращивание пищи.",marker(farm,"Теплица"),{type:"status",base:base.id});
      return goal("Дождись урожая","Теплица производит 2 ед. пищи за 30 игровых секунд. Ускорь ожидание ×4 при безопасных условиях.",marker(farm,"Теплица","production","УРОЖАЙ"),{type:"inspect",x:farm.x,y:farm.y});
    }
    return null;
  }

  function occupyGoal(state,base) {
    const room=rooms(base,"habitat").find(b=>!b.room.occupied);
    if(!room)return roomGoal(state,base,"habitat");
    if(base.temp<E.SAFE_TEMP-E.EPS || !room.room.powered)
      return support(state,base)||goal("Прогрей жилой модуль","Для заселения нужно питание и не менее +16 °C.",marker(room,"Жилой отсек"));
    const supplies=suppliesGoal(state,base,2,2);
    return supplies||equipmentGoal(room,"Засели жилой отсек","Подъедь к модулю и нажми E.");
  }

  function current(state) {
    const city=state.bases[0], weather=E.weather(state);
    if(state.finalResult?.success)return goal("Обе колонии выстояли","Экспедиция завершена. Исследуй построенные поселения.");
    if(state.finalResult)return goal("Испытание прервано","Вернись к прогнозу и подготовь запасы.");
    if(state.trial) {
      if(state.trial.phase==="scheduled"||state.trial.phase==="warning"){
        for(const base of state.bases) {
          const supply=readiness(state,base).slice(2);
          if(supply.some(value=>!value.ok)){
            const power=E.powerEstimate(state,base);
            const needed=state.chapter===1?2:Math.max(2,Math.ceil(power.occupants/2*Math.max(0,state.trial.end-Math.max(state.elapsed,state.trial.warn))/60));
            const step=suppliesGoal(state,base,needed,needed);
            if(step)return step;
          }
        }
        return goal("Подготовься к прогнозу","Заряди батареи, накопи воду и пищу. При необходимости останови лишнее производство.",null,{type:"status"});
      }
      return goal(weather.storm?"Сохрани жизнь колоний":"Дождись рассвета",
        weather.storm?"Дроны ожидают окончания бури. Сохраняй питание жилых отсеков и отопления.":"Следи за зарядом, водой и пищей до конца испытания.",null,{type:"status"});
    }
    if(totalCargo(state)>=E.CARGO_CAP) {
      const base=closest(state,state.bases.map(b=>E.SITES[b.id]));
      return unloadGoal(state,E.byId(state,base.id));
    }
    if(state.chapter===1) {
      for(const type of ["solar","refinery","battery"])if(!count(city,type))return buildingGoal(state,city,type);
      for(const type of ["habitat","greenhouse"])if(!rooms(city,type).length)return roomGoal(state,city,type);
      const power=E.powerEstimate(state,city);
      const supplies=suppliesGoal(state,city,4,4);
      if(supplies)return supplies;
      if(city.temp<E.SAFE_TEMP-E.EPS)return goal("Прогрей первый купол","Дождись температуры от +16 °C.",marker(E.SITES.city,"Склад"));
      const farm=rooms(city,"greenhouse").find(item=>item.room.enabled);
      if(farm)return equipmentGoal(farm,"Сохрани запасы перед ночью","Пища и вода готовы. Приостанови теплицу, чтобы сохранить запас воды и заряд для испытания.");
      if(city.charge+E.EPS<Math.min(power.capacity,power.nightLoad*2+1.5)) {
        return support(state,city)||goal("Заряди аккумулятор","Проверь дневную выработку. После урожая можно приостановить теплицу, чтобы накопить заряд.",marker(E.SITES.city,"Склад"));
      }
      return goal("Назначь первое испытание","Проверь запас воды, пищи и заряда. Переживи бурю и ночь до прибытия экипажа.",null,{type:"trial"});
    }
    if(state.chapter===2) {
      const solar=city.buildings.find(b=>b.type==="solar"&&b.dirty);
      if(solar&&!weather.storm)return equipmentGoal(solar,"Очисти панель","После бури выработка снижена. Подъедь к панели и нажми E.");
      for(const type of ["habitat","greenhouse"])if(rooms(city,type).length<2)return roomGoal(state,city,type);
      const extra=support(state,city);
      if(extra)return extra;
      if(rooms(city,"habitat").filter(b=>b.room.occupied).length<2)return occupyGoal(state,city);
      const offFarm=rooms(city,"greenhouse").find(b=>!b.room.enabled);
      if(offFarm)return equipmentGoal(offFarm,"Запусти вторую теплицу","Для развития города обе теплицы должны работать одновременно.");
      if(!state.logistics) {
        if(!state.drones.length&&!affordable(city,6))return materialsGoal(state,city);
        return goal("Наладь первый рейс","Собери дрон рядом со складом или назначь маршрут существующему дрону.",marker(E.SITES.city,"Склад"),{type:"drones",base:"city"});
      }
      const supplies=suppliesGoal(state,city,3,4);
      return supplies||goal("Запусти обе теплицы","Проверь питание и воду. Город готов, когда обе теплицы работают.",null,{type:"status"});
    }
    if(state.chapter===3) {
      if(!state.selectedSite) {
        const discovered=state.explored.filter(id=>E.SITES[id]&&id!=="city");
        const site=closest(state,[E.SITES.basin,E.SITES.plateau].filter(s=>!state.explored.includes(s.id)));
        if(discovered.length)return goal("Выбери второе поселение","Низина располагает льдом. Плато даёт больше энергии. Выбор доступен в «Обзоре».",marker(E.SITES[discovered[0]],"Обследованный участок"),{type:"status"});
        return goal("Обследуй Марс","Подъедь к выбранной площадке; после разведки она появится среди участков.",marker(site,site?.name));
      }
      const base=E.byId(state,state.selectedSite);
      if(!base)return freightGoal(state,state.selectedSite,"parts");
      for(const type of ["solar","battery"])if(!count(base,type))return buildingGoal(state,base,type);
      for(const type of ["habitat","greenhouse"])if(!rooms(base,type).length)return roomGoal(state,base,type);
      const extra=support(state,base);
      if(extra)return extra;
      return occupyGoal(state,base);
    }
    for(const base of state.bases) {
      const extra=support(state,base);
      if(extra)return extra;
      const supply=suppliesGoal(state,base,Math.max(4,Math.ceil(E.powerEstimate(state,base).occupants*1.875)),Math.max(4,Math.ceil(E.powerEstimate(state,base).occupants*1.875)));
      if(supply)return supply;
      if(readiness(state,base).some(item=>!item.ok))
        return goal("Подготовь "+E.SITES[base.id].name,"Проверь отопление, заряд батарей и запасы. Останови лишнее производство, когда запас готов.",marker(E.SITES[base.id],"Склад"),{type:"status",base:base.id});
    }
    return goal("Назначь большую бурю","Обе базы подготовлены по основным запасам. Следи за энергией и водой до рассвета.",null,{type:"trial"});
  }

  const Guidance={nearby,current,readiness,cargoText,requirements,constructionGoal,placementCells,production};
  if(typeof module==="object"&&module.exports)module.exports=Guidance;
  else globalThis.TerraformiaGuidance=Guidance;
}());

</script>
  <script>
(function () {
  "use strict";
  const E = globalThis.TerraformiaEngine;
  const TAU = Math.PI * 2;
  const MODEL_COLORS = {
    solar:"#597c91", battery:"#9dd4c0", refinery:"#e6a077", sector:"#c4c7a9",
    greenhouse:"#a0d7a1", habitat:"#edc89b", insulation:"#e3a989"
  };
  const TERRAIN_SCALE=34;
  const LANDMARKS=[
    {x:2.2,y:14.8,label:"Старый зонд",angle:.42},
    {x:24.1,y:7.2,label:"Станция наблюдения",angle:-.73}
  ];

  function clamp(value, low, high) {
    return Math.min(high, Math.max(low, value));
  }

  function randomSource(seed) {
    let value = seed >>> 0;
    return () => {
      value = (Math.imul(value,1664525) + 1013904223) >>> 0;
      return value / 4294967296;
    };
  }

  function field(columns, rows, random) {
    const values = Float32Array.from({length:(columns+1)*(rows+1)},random);
    return (x,y) => {
      const gx = clamp(x / E.W * columns,0,columns-1e-6);
      const gy = clamp(y / E.H * rows,0,rows-1e-6);
      const tx = Math.floor(gx);
      const ty = Math.floor(gy);
      const fx = gx - tx;
      const fy = gy - ty;
      const sx = fx*fx*(3-2*fx);
      const sy = fy*fy*(3-2*fy);
      const idx = ty*(columns+1)+tx;
      const top = values[idx]*(1-sx)+values[idx+1]*sx;
      const bottom = values[idx+columns+1]*(1-sx)+values[idx+columns+2]*sx;
      return (1-sy)*top + sy*bottom;
    };
  }

  function ground() {
    const canvas = document.createElement("canvas");
    const width = E.W * TERRAIN_SCALE;
    const height = E.H * TERRAIN_SCALE;
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d", { alpha:false });
    const rnd = randomSource(187407);
    const broad = field(10,7,rnd), medium = field(34,24,rnd), fine = field(125,83,rnd);
    const craters = [[4.0,5.5,2.4],[19.7,5.6,2.5],[24.6,13.2,3.2],[17.3,25.8,2.7],
      [43.0,18.7,2.4],[8.2,26.7,2.0],[45.4,3.9,2.2],[28.8,27.9,2.1],[0.9,17.8,2.0],[31.1,11.8,1.2],
      [5.1,17.3,1.55],[18.4,14.1,1.65],[39.0,26.0,1.1]];
    const relief = new Float32Array(width*height);
    const mineral = new Float32Array(width*height);
    const zones = new Float32Array(width*height);
    for (let row = 0; row < height; row++) {
      const y = row / TERRAIN_SCALE;
      for (let col=0; col<width; col++) {
        const x = col / TERRAIN_SCALE;
        const n = broad(x,y);
        const m = medium(x,y);
        const g = fine(x,y);
        const delta = x*.54-y+1.1*Math.sin(y*.65)+n*3.5;
        const ridge = Math.exp(-delta*delta*.26);
        const sediment = Math.sin(.9*x+2.2*y+n*10)*.026 + Math.sin(.36*x+1.5*y+n*8)*.07;
        const ravine = x-(24.7+1.8*Math.sin(y*.36)+.9*Math.sin(y*.83));
        const gorge = Math.exp(-ravine*ravine*1.0)*Math.exp(-(((y-13.5)/11)**2));
        let altitude = n*.58+m*.27+g*.105+sediment+ridge*.43-gorge*.28;
        let tone = m*.48+g*.27+n*.25;
        for (const [cx,cy,r] of craters) {
          const d2 = (x-cx)*(x-cx) + ((y-cy)*1.07)*((y-cy)*1.07);
          if (d2 > 1.8*r*r) continue;
          const d = Math.sqrt(d2)/r;
          const rim = (d-.91)*11.5;
          altitude += Math.exp(-rim*rim)*(.22+.065*m) - Math.max(0,1-d)*.36;
          tone -= Math.max(0,1-d)*.18;
        }
        const basin = Math.pow(Math.exp(-(((x-35.5)/10)**2+((y-23)/5.5)**2)),.78);
        const plateau = Math.exp(-(((x-38)/9.0)**2+((y-7.4)/5.5)**2));
        const shelves = Math.sin(altitude*31+m*3)*.018*plateau;
        const frostCracks=basin*Math.abs(Math.sin((x+n*1.9)*2.9+(y+m*1.6)*1.8));
        const i = row*width+col;
        zones[i] = basin - .9*plateau;
        relief[i] = altitude + plateau*.43-basin*.22+shelves;
        mineral[i] = tone + (frostCracks>.94?.17:0);
      }
    }
    const pix = ctx.createImageData(width,height);
    for (let y=0; y<height; y++) {
      for (let x=0; x<width; x++) {
        const i = y*width+x;
        const h = relief[i];
        const left = relief[x ? i-1 : i];
        const above = relief[y ? i-width : i];
        const hill = clamp((h-left)*590+(h-above)*830,-55,53);
        const grain = (rnd() - .5)*18;
        const stratum = mineral[i];
        const frost = Math.max(0,zones[i]);
        const raised = Math.max(0,-zones[i]);
        const sun = (x/width)*7 + (1-y/height)*9;
        const shade = 92*h + 24*stratum + hill + grain + sun;
        const p = i*4;
        pix.data[p] = 96+shade+27*raised-40*frost;
        pix.data[p+1] = 48+.79*shade+26*raised+26*frost;
        pix.data[p+2] = 35+.53*shade+12*raised+51*frost;

    function path() {
      const start=E.SITES.city, pad=E.PAD;
      ctx.beginPath();
      ctx.moveTo(start.x+.5,start.y+.5);
      ctx.quadraticCurveTo(9.2,16.2,pad.x+.5,pad.y+.5);

        const site=E.SITES[deposit.site];
        if(!E.byId(state,site.id))continue;
        ctx.moveTo(site.x+.5,site.y+.5);
        ctx.quadraticCurveTo((site.x+deposit.x)*.5+.3,site.y+(deposit.y-site.y)*.22,deposit.x+.5,deposit.y+.5);
      }
      if (state.chapter<3) return;
      ctx.moveTo(start.x+.5,start.y+.5);
      ctx.bezierCurveTo(19,16,23,18,27,16.3);
      ctx.quadraticCurveTo(30,13,E.SITES.plateau.x+.5,E.SITES.plateau.y+.5);
      ctx.moveTo(23,17.1);
      ctx.quadraticCurveTo(29.6,21.5,E.SITES.basin.x+.5,E.SITES.basin.y+.5);

    path();
    ctx.strokeStyle="#e2b78a40";
    ctx.lineWidth=.66;ctx.stroke();
    ctx.strokeStyle="#77574260";
    ctx.lineWidth=.37;ctx.stroke();
    ctx.strokeStyle="#ddb88b39";
    ctx.lineWidth=.23;ctx.stroke();
    ctx.lineCap="butt";
  }

    let lastTrack=null;
    const view={x:11.5,y:17.25};
    const rnd = randomSource(229);
    const dust = Array.from({length:195},()=>[rnd(),rnd(),rnd(),rnd()]);

    function size() {
      const bounds=canvas.getBoundingClientRect();
      width=Math.max(1,bounds.width);
      height=Math.max(1,bounds.height);
      dpr=clamp(globalThis.devicePixelRatio || 1,1,2);
      if (canvas.width !== Math.round(width*dpr) || canvas.height !== Math.round(height*dpr)) {
        canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
      }
    }

    function point(clientX,clientY) {
      const rect=canvas.getBoundingClientRect();
      return {x:(clientX-rect.left-x0)/scale,y:(clientY-rect.top-y0)/scale};
    }

    function screen(x,y) {
      return {x:x0+x*scale,y:y0+y*scale,scale};
    }

    function effect(item,kind,message,start) {
      if(!item||!Number.isFinite(item.x)||!Number.isFinite(item.y))return;
      effects.push({x:item.x+.5,y:item.y+.5,kind,message,start});
      if(effects.length>16)effects.shift();
    }

    function drawTracks(state,moving) {
      if(moving && (!lastTrack||Math.hypot(state.rover.x-lastTrack.x,state.rover.y-lastTrack.y)>.15)) {
        lastTrack={x:state.rover.x,y:state.rover.y,angle:state.rover.angle};
        tracks.push(lastTrack);
        if(tracks.length>330)tracks.shift();
      }
      for(const [i,track] of tracks.entries()){
        const p=screen(track.x,track.y);
        if(p.x<-scale||p.x>width+scale||p.y<-scale||p.y>height+scale)continue;
        ctx.save();ctx.translate(track.x,track.y);ctx.rotate(track.angle);
        ctx.globalAlpha=.14+.28*i/tracks.length;
        rect(ctx,-.11,-.29,.17,.104,"#372b2d");
        rect(ctx,-.11,.186,.17,.104,"#372b2d");
        ctx.globalAlpha*=.65;rect(ctx,-.085,-.285,.025,.087,"#ead2b1");
        rect(ctx,-.085,.19,.025,.087,"#ead2b1");ctx.restore();
      }
    }

    function worldEffect(weather,t,quiet) {
      ctx.setTransform(dpr,0,0,dpr,0,0);
      if (weather.night) {
        const night=ctx.createLinearGradient(0,0,width*.65,height);
        night.addColorStop(0,"#263658af");night.addColorStop(1,"#111e3bb1");
        ctx.fillStyle=night;ctx.fillRect(0,0,width,height);
      } else if (weather.clock>208) {
        ctx.fillStyle=`rgba(178,94,52,${.08+.11*(weather.clock-208)/32})`;ctx.fillRect(0,0,width,height);
      }
      if(weather.storm){
        ctx.fillStyle=weather.night?"#89695572":"#d4a06b7b";
        ctx.fillRect(0,0,width,height);
        for(const [x,y,r,a] of dust){
          const sway=quiet?0:(t*(.055+.084*r));
          const drift=(x+sway)%1.06-.03;
          const px=drift*width,py=((y+sway*.18)%1.03)*height;
          ctx.strokeStyle=`rgba(255,215,166,${.07+.28*a})`;
          ctx.lineWidth=.6+r*1.65;ctx.beginPath();ctx.moveTo(px,py);
          ctx.lineTo(px+3+r*29,py+1+r*6);ctx.stroke();
        }
      }
      const radius = Math.max(width,height)*.7;
      const shade=ctx.createRadialGradient(width*.52,height*.47,Math.min(width,height)*.25,width*.54,height*.48,radius);
      shade.addColorStop(0,"#120c1900");shade.addColorStop(1,"#110e1c73");
      ctx.fillStyle=shade;ctx.fillRect(0,0,width,height);
    }

    const goalColor=goal=>({build:"#a5f0c1",ore:"#ffbe88",ice:"#a7e9ff",unload:"#ffdc92",production:"#a7e4d2"})[goal?.kind]||"#ffda9d";

    function drawMini(state,active,goal) {
      const mw=overview.width,mh=overview.height;
      mini.drawImage(terrain,0,0,mw,mh);
      mini.fillStyle="#211e2360";mini.fillRect(0,0,mw,mh);
      for(const deposit of E.DEPOSITS) {
        if(deposit.site!=="city"&&state.chapter<3)continue;
        mini.fillStyle=deposit.type==="ice"?"#badfe9":"#e7b188";
        mini.fillRect((deposit.x+.5)/E.W*mw-1.3,(deposit.y+.5)/E.H*mh-1.3,2.6,2.6);
      }
      for(const site of Object.values(E.SITES)){
        if(site.id!=="city" && state.chapter<3)continue;
        const isLive=E.byId(state,site.id);
        mini.fillStyle = isLive ? "#99e0c8" : "#e7ab88";
        mini.strokeStyle="#272a29";
        const px=(site.x+.5)/E.W*mw,py=(site.y+.5)/E.H*mh;
        mini.fillRect(px-2,py-2,4.8,4.8);mini.strokeRect(px-2,py-2,4.8,4.8);
        if(site.id===active){
          mini.strokeStyle="#b1efdd";
          mini.beginPath();mini.arc(px+.4,py+.4,6,0,TAU);mini.stroke();
        }
      }
      mini.strokeStyle="#f2dac4af";
      mini.lineWidth=1;
      mini.strokeRect(-x0/scale/E.W*mw,-y0/scale/E.H*mh,width/scale/E.W*mw,height/scale/E.H*mh);
      mini.fillStyle="#fff4d5";mini.beginPath();
      mini.arc(state.rover.x/E.W*mw,state.rover.y/E.H*mh,2.7,0,TAU);mini.fill();
      if(goal){
        const px=(goal.x+.5)/E.W*mw,py=(goal.y+.5)/E.H*mh;
        mini.fillStyle=goalColor(goal);polygon(mini,[[px,py-4.5],[px+4.5,py],[px,py+4.5],[px-4.5,py]],"#554733",1);
      }
    }

    function markerLabel(text,x,y,color) {
      if(!text)return;
      ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.font="700 10px ui-monospace, monospace";ctx.textAlign="center";ctx.textBaseline="middle";
      const w=ctx.measureText(text).width+14;
      x=clamp(x,w/2+8,width-w/2-8); y=clamp(y,19,height-18);
      ctx.fillStyle="#182321ee";ctx.fillRect(x-w/2,y-10,w,20);
      ctx.strokeStyle=color;ctx.lineWidth=.8;ctx.strokeRect(x-w/2,y-10,w,20);
      ctx.fillStyle=color;ctx.fillText(text,x,y+1);ctx.restore();
    }

    function goalMarker(goal,t,quiet) {
      if(!goal||width<64||height<84)return;
      const p=screen(goal.x+.5,goal.y+.5);
      const color=goalColor(goal);
      const pulse=quiet?0:.5+.5*Math.sin(t*3.1);
      const visible=p.x>20&&p.x<width-20&&p.y>48&&p.y<height-87;
      if(visible){
        ctx.save();
        if(goal.kind==="build"){
          ctx.fillStyle=color+"21";ctx.fillRect(goal.x+.04,goal.y+.04,.92,.92);
          border(ctx,goal.x,goal.y,color);
        }
        ctx.strokeStyle=color;ctx.lineWidth=.038;
        const r=.57+.08*pulse;
        ctx.beginPath();ctx.arc(goal.x+.5,goal.y+.5,r,0,TAU);ctx.stroke();
        ctx.fillStyle=color;
        const x=goal.x+.5,y=goal.y-.25-pulse*.04;
        polygon(ctx,[[x,y-.13],[x+.115,y],[x,y+.13],[x-.115,y]],"#273a31",.02);
        ctx.restore();
        const labelY=p.y>82+scale*.55?p.y-scale*.91-10:p.y+scale*.77+13;
        markerLabel(goal.tag,p.x,labelY,color);
        return;
      }
      ctx.setTransform(dpr,0,0,dpr,0,0);
      const cx=width*.5,cy=height*.50;
      const dx=p.x-cx,dy=p.y-cy;
      const angle=Math.atan2(dy,dx);
      const factor=Math.min((cx-27)/(Math.abs(dx)||1),(Math.max(28,cy-92))/(Math.abs(dy)||1));
      const x=clamp(cx+dx*factor,24,width-24),y=clamp(cy+dy*factor,49,Math.max(49,height-84));
      ctx.save();ctx.translate(x,y);ctx.rotate(angle);
      ellipse(ctx,0,0,15,15,"#232e2cdd",color,1.4);
      ctx.fillStyle=color;polygon(ctx,[[8,0],[-5,-6],[-2,0],[-5,6]]);
      ctx.restore();
      markerLabel(goal.tag,x,y>height*.52?y-27:y+27,color);
      ctx.setTransform(scale*dpr,0,0,scale*dpr,x0*dpr,y0*dpr);
    }

    function drawEffects(t,quiet) {
      for(let index=effects.length-1;index>=0;index--) {
        const entry=effects[index], age=Math.max(0,t-entry.start);
        if(age>1.45){effects.splice(index,1);continue;}
        const progress=age/1.45,p=screen(entry.x,entry.y);
        if(p.x<-50||p.y<-40||p.x>width+50||p.y>height+50)continue;
        const color=entry.kind==="ice"?"#caf4fc":entry.kind==="ore"?"#ffcca0":"#d4f0c2";
        ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);
        if(!quiet)for(let i=0;i<11;i++){
          const angle=i*2.399+entry.x, radial=(8+i%3*5)*Math.sin(Math.min(1,age*2.4)*Math.PI*.5);
          ctx.globalAlpha=Math.max(0,(1-age*1.3))*.85;
          ctx.fillStyle=color;ctx.fillRect(p.x+Math.cos(angle)*radial,p.y+Math.sin(angle)*radial-age*9,2.7,2.7);
        }
        ctx.globalAlpha=1-Math.max(0,progress-.63)/.37;
        ctx.font="750 13px ui-monospace, monospace";ctx.textAlign="center";ctx.textBaseline="middle";
        const textY=p.y-19-(quiet?0:25*progress);
        const textWidth=ctx.measureText(entry.message).width+16;
        ctx.fillStyle="#172623e6";ctx.fillRect(p.x-textWidth/2,textY-10,textWidth,20);
        ctx.fillStyle=color;ctx.fillText(entry.message,p.x,textY);
        ctx.restore();
      }
    }

    function draw(state, options) {
      const {title,follow,focus,selected,pointer,build,conditions,selectedBase,t,delta,moving,reduced,minimap,target,goal,placement=[]}=options;
      const eased = previousScene === title && !reduced ? 1 - Math.exp(-15 * delta) : 1;
      const targetScale = title ? clamp(width/12,55,116) : clamp(width/14.5,44,72)*zoom;
      scale += (targetScale - scale) * eased;
      const halfX=width/(2*scale),halfY=height/(2*scale);
      const tx= title ? 11.0-width*.195/scale : follow ? state.rover.x : focus.x;
      const ty= title ? 15.0 : follow ? state.rover.y : focus.y;
      view.x = clamp(view.x + (tx - view.x) * eased,halfX,Math.max(halfX,E.W-halfX));
      view.y = clamp(view.y + (ty - view.y) * eased,halfY,Math.max(halfY,E.H-halfY));
      previousScene = title;
      x0 = width/2 - view.x*scale;
      y0 = height/2 - view.y*scale;
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.fillStyle="#302527";ctx.fillRect(0,0,width,height);
      ctx.setTransform(scale*dpr,0,0,scale*dpr,x0*dpr,y0*dpr);
      ctx.drawImage(terrain,0,0,E.W,E.H);
      roads(ctx,state);
      for(const landmark of LANDMARKS)oldProbe(ctx,landmark);
      if(!title)drawTracks(state,moving&&!reduced);

      for (const base of state.bases) {
        const site=E.SITES[base.id];
        if (build && base.id===selectedBase) {
          const [a,b,c,d]=site.bounds;
          ctx.fillStyle="#b4ecbf13";
          ctx.fillRect(a,b,c-a+1,d-b+1);
          ctx.strokeStyle="#a6dab66b";ctx.lineWidth=.021;ctx.setLineDash([.13,.14]);
          ctx.strokeRect(a,b,c-a+1,d-b+1);ctx.setLineDash([]);
        }
        if (!title && !build) {
          const az=conditions.night ? "#95e1cd88" : "#afe9cb93";
          dashed(ctx,site.x+.5,site.y+.5,.68,az);
        }
        foundationPaths(ctx,base,conditions.night);
        const capacity=base.telemetry.capacity||base.buildings.filter(b=>b.type==="battery").length*E.CAPACITY;
        for(const item of base.buildings){
          ctx.save();ctx.translate(item.x+.5,item.y+.5);
          const model=item.type==="battery"?{...item,chargeRatio:capacity?base.charge/capacity:0}:item;
          moduleModel(ctx,item.type,model,reduced?0:t);
          ctx.restore();
        }
        ctx.save();ctx.translate(site.x+.5,site.y+.5);moduleModel(ctx,"depot");ctx.restore();
      }

      for (const deposit of E.DEPOSITS) {
        if (deposit.site!=="city" && state.chapter<3 && !title) continue;
        ctx.save();ctx.translate(deposit.x+.5,deposit.y+.5);rocks(ctx,deposit,E.accessibleDeposit(state,deposit));ctx.restore();
      }
      ctx.save();ctx.translate(E.PAD.x+.5,E.PAD.y+.5);padModel(ctx,state.crew || title);ctx.restore();

      if(state.chapter>=3) for (const site of [E.SITES.basin,E.SITES.plateau]) {
        if(E.byId(state,site.id))continue;
        const chosen=state.selectedSite===site.id;
        const explored=state.explored.includes(site.id);
        ellipse(ctx,site.x+.5,site.y+.5,.45,.45,"#152d2c63");
        dashed(ctx,site.x+.5,site.y+.5,.46,chosen?"#a7f0cd":explored?"#e6b29a":"#c9bc98bb");
        rect(ctx,site.x+.43,site.y+.43,.14,.14,chosen?"#a7f0cd":"#f2bf9c");
      }

      if(!title && state.chapter>=2) {
        for(const drone of state.drones) {
          if(!drone.route || drone.phase==="ready")continue;
          const {x,y}=E.dronePosition(drone);
          ctx.save();ctx.translate(x,y);droneModel(ctx,drone.cargo,reduced?0:t,!drone.paused&&!conditions.storm&&!reduced);ctx.restore();
        }
      }
      ctx.save();ctx.translate(state.rover.x,state.rover.y);ctx.rotate(state.rover.angle);
      const movingDust = moving && !reduced && !title;
      if (movingDust) for(let i=0;i<8;i++){
        const wave=(t*(i%2?1.8:1.1)+i*.153)%1;
        ellipse(ctx,-.42-wave*.55,Math.sin(i*8+t*3)*.165,.034+wave*.09,.02+wave*.056,`rgba(239,178,128,${.31*(1-wave)})`);
      }
      roverModel(ctx,conditions.night,movingDust,state.rover.cargo.ore+state.rover.cargo.ice,t);
      ctx.restore();

      worldEffect(conditions,t,reduced);
      ctx.setTransform(scale*dpr,0,0,scale*dpr,x0*dpr,y0*dpr);
      if(conditions.night) {
        ctx.save();ctx.globalCompositeOperation="screen";
        for(const base of state.bases){
          const depot=E.SITES[base.id];
          if(base.telemetry.heat||base.telemetry.life)glow(ctx,depot.x+.5,depot.y+.5,.64,"#ffd6a041");
          for(const item of base.buildings)if(item.room?.powered){
            glow(ctx,item.x+.5,item.y+.5,.78,item.room.type==="greenhouse"?"#b5de8b5c":"#ffd08b63");
          }
        }
        ctx.translate(state.rover.x,state.rover.y);ctx.rotate(state.rover.angle);
        const light=ctx.createLinearGradient(.36,0,2.15,0);
        light.addColorStop(0,"#e4ca8f9a");light.addColorStop(1,"#f9d99400");
        ctx.fillStyle=light;polygon(ctx,[[.35,-.18],[2.15,-.66],[2.15,.66],[.35,.18]]);
        ctx.restore();
      }
      if (title) return null;
      const cursor = pointer ? point(pointer.clientX,pointer.clientY) : null;
      const hover = cursor ? { x:Math.floor(cursor.x), y:Math.floor(cursor.y) } : null;
      if (build) {
        const startX=Math.max(0,Math.floor(-x0/scale));
        const startY=Math.max(0,Math.floor(-y0/scale));
        ctx.strokeStyle="#f6ddc345";ctx.lineWidth=.01;ctx.beginPath();
        for(let x=startX;x<=Math.min(E.W,(width-x0)/scale+1);x++){ctx.moveTo(x,startY);ctx.lineTo(x,Math.min(E.H,(height-y0)/scale));}
        for(let y=startY;y<=Math.min(E.H,(height-y0)/scale+1);y++){ctx.moveTo(startX,y);ctx.lineTo(Math.min(E.W,(width-x0)/scale),y);}
        ctx.stroke();
        for(const cell of placement){
          ctx.fillStyle="#92e8b31c";ctx.fillRect(cell.x+.035,cell.y+.035,.93,.93);
          border(ctx,cell.x,cell.y,"#b1edcf84");
        }
      }
      for(const base of state.bases) {
        const site=E.SITES[base.id];
        label(ctx,base.id==="city"?"СКЛАД ДОЛИНЫ":"СКЛАД",site.x+.5,site.y+.98,"#bce4d4",51/scale);
      }
      for(const deposit of E.DEPOSITS) {
        if(deposit.site!=="city" && state.chapter<3)continue;
        label(ctx,E.RESOURCE_NAMES[deposit.type].toUpperCase(),deposit.x+.5,deposit.y+1.02,deposit.type==="ice"?"#c1e6e0":"#f2c2a5",50/scale);
      }
      if(state.chapter>=3)for(const id of ["basin","plateau"]){
        const site=E.SITES[id];
        if(!E.byId(state,id)) label(ctx,id==="basin"?"НИЗИНА":"ПЛАТО",site.x+.5,site.y+1.17,"#eac5af",50/scale);
      }
      if(scale>41)for(const landmark of LANDMARKS) {
        if(Math.hypot(landmark.x-view.x,landmark.y-view.y)<7)
          label(ctx,landmark.label,landmark.x,landmark.y+.73,"#d2c6ae",49/scale);
      }
      goalMarker(goal,t,reduced);
      if(target&&!build) {
        const color=target.available?"#d2f8dfba":"#efb57caa";
        dashed(ctx,target.item.x+.5,target.item.y+.5,.64,color,reduced?0:t*.1);
      }
      if(selected)border(ctx,selected.x,selected.y,"#b5f0d5");
      if(hover){
        const checked=build?E.checkBuild(state,build,hover.x,hover.y):null;
        const color = build && (checked.message||checked.base?.id!==selectedBase) ? "#f3a481" : "#b1edcf";
        if(build&&hover.x>=0&&hover.x<E.W&&hover.y>=0&&hover.y<E.H){
          ctx.fillStyle=color+"3d";ctx.fillRect(hover.x,hover.y,1,1);
          ctx.save();ctx.translate(hover.x+.5,hover.y+.5);ctx.globalAlpha=.59;
          if(build==="greenhouse"||build==="habitat")moduleModel(ctx,"sector",{room:{type:build,powered:true,occupied:build==="habitat"}});
          else if(build==="insulation")moduleModel(ctx,"sector",{insulated:true});
          else moduleModel(ctx,build);
          ctx.restore();
        }
        if(build || E.getPlace(state,hover.x,hover.y))border(ctx,hover.x,hover.y,color);
      }
      dashed(ctx,state.rover.x,state.rover.y+.014,.53,"#c6eed5a4",reduced?0:t*.15);
      drawEffects(t,reduced);
      if(minimap)drawMini(state,selectedBase,goal);
      return hover;
    }

    function changeZoom(delta) {
      zoom=clamp(zoom*Math.pow(1.16,delta),.72,1.42);
    }

    function icon(canvas,type) {
      const ctx=canvas.getContext("2d");
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.save();
      ctx.translate(canvas.width/2,canvas.height/2);
      ctx.scale(canvas.width*.82,canvas.height*.90);
      if(type==="greenhouse" || type==="habitat"){
        moduleModel(ctx,"sector",{room:{type,powered:true,occupied:true}});
      } else if(type==="insulation"){
        moduleModel(ctx,"sector",{insulated:true});
      } else {
        moduleModel(ctx,type);
      }
      ctx.restore();
    }

    function settlement(canvas,state,id) {
      const base=E.byId(state,id);
      if(!base)return;
      const panel=canvas.getContext("2d",{alpha:false});
      const site=E.SITES[id], places=[site,...base.buildings];
      const xA=Math.min(...places.map(p=>p.x))-1.1,yA=Math.min(...places.map(p=>p.y))-1.1;
      const xB=Math.max(...places.map(p=>p.x))+2.1,yB=Math.max(...places.map(p=>p.y))+2.1;
      const viewScale=Math.min(canvas.width/(xB-xA),canvas.height/(yB-yA));
      const tx=canvas.width/2-viewScale*(xA+xB)/2,ty=canvas.height/2-viewScale*(yA+yB)/2;
      panel.setTransform(viewScale,0,0,viewScale,tx,ty);
      panel.fillStyle="#8b6e53";panel.fillRect(-tx/viewScale,-ty/viewScale,canvas.width/viewScale,canvas.height/viewScale);
      panel.drawImage(terrain,0,0,E.W,E.H);
      roads(panel,state);
      foundationPaths(panel,base,false);
      for(const item of [...places]) {
        panel.save();panel.translate(item.x+.5,item.y+.5);
        moduleModel(panel,item===site?"depot":item.type,item);panel.restore();
      }
      panel.setTransform(1,0,0,1,0,0);
      const shade=panel.createLinearGradient(0,0,0,canvas.height);
      shade.addColorStop(0,"#f4bd7720");shade.addColorStop(1,"#1827274a");
      panel.fillStyle=shade;panel.fillRect(0,0,canvas.width,canvas.height);
    }

    size();
    return {size,draw,point,screen,changeZoom,icon,effect,settlement,
      resetView(){previousScene=null;lastTrack=null;tracks.length=0;effects.length=0;}};
  }

  globalThis.TerraformiaRender = { createRenderer, MODEL_COLORS };
}());

</script>
  <script>
(function () {
  "use strict";

  const PREFERENCE = "terraformia:mute";
  const MASTER_LEVEL = 0.68;

  function createSoundscape() {
    const AudioContext = globalThis.AudioContext || globalThis.webkitAudioContext;
    const lastCue = new Map();
    let context, master, noiseBuffer, wind, tracks, motor, resume;
    let muted = false;
    let wasActive = false;
    let lastMix = -Infinity;

    try {
      muted = globalThis.localStorage.getItem(PREFERENCE) === "1";
    } catch {
      // Sound is still available when storage is blocked.
    }

    function noise(type, frequency, loop = false) {
      const source = context.createBufferSource();
      const filter = context.createBiquadFilter();
      const gain = context.createGain();
      source.buffer = noiseBuffer;
      source.loop = loop;
      filter.type = type;
      filter.frequency.value = frequency;
      filter.Q.value = 0.7;
      gain.gain.value = 0;
      source.connect(filter);
      filter.connect(gain);
      gain.connect(master);
      return { source, filter, gain:gain.gain };
    }

    function prepare() {
      context = new AudioContext();
      master = context.createGain();
      master.gain.value = muted ? 0 : MASTER_LEVEL;
      const limiter = context.createDynamicsCompressor();
      limiter.threshold.value = -13;
      limiter.ratio.value = 5;
      master.connect(limiter);
      limiter.connect(context.destination);

      noiseBuffer = context.createBuffer(1, context.sampleRate * 4, context.sampleRate);
      const samples = noiseBuffer.getChannelData(0);
      for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;

      wind = noise("bandpass", 330, true);
      wind.source.start();
      tracks = noise("lowpass", 540, true);
      tracks.source.playbackRate.value = 1.18;
      tracks.source.start(0, 1.37);

      const oscillator = context.createOscillator();
      const filter = context.createBiquadFilter();
      const gain = context.createGain();
      oscillator.type = "triangle";
      oscillator.frequency.value = 52;
      filter.type = "lowpass";
      filter.frequency.value = 195;
      filter.Q.value = 0.1;
      gain.gain.value = 0;
      oscillator.connect(filter);
      filter.connect(gain);
      gain.connect(master);
      oscillator.start();
      motor = { pitch:oscillator.frequency, gain:gain.gain, filter:filter.frequency };
    }

    function unlock() {
      if (!AudioContext || muted) return;
      try {
        if (!context) prepare();
        if (context.state !== "running" && !resume) {
          resume = context.resume().catch(() => {}).finally(() => { resume = null; });
        }
      } catch {
        // Sound is optional on browsers without an available audio output.
      }
    }

    function toggle() {
      muted = !muted;
      try {
        globalThis.localStorage.setItem(PREFERENCE, muted ? "1" : "0");
      } catch {
        // Keep the choice for the current session.
      }
      if (master) master.gain.setTargetAtTime(muted ? 0 : MASTER_LEVEL, context.currentTime, 0.025);
      if (!muted) unlock();
    }

    function mix(active, speed, weather) {
      if (!motor || context.state !== "running" || (!active && !wasActive)) return;
      const now = context.currentTime;
      if (active && wasActive && now - lastMix < 0.055) return;
      wasActive = active;
      lastMix = now;
      const throttle = active ? Math.min(1, Math.max(0, speed)) : 0;
      const gust = 0.78 + 0.15 * Math.sin(now * 0.98) + 0.07 * Math.sin(now * 3.1);
      const breeze = weather.storm ? 0.31 : weather.night ? 0.105 : 0.14;
      wind.gain.setTargetAtTime(active && !muted ? breeze * gust : 0, now, 0.16);
      wind.filter.frequency.setTargetAtTime(weather.storm ? 620 : weather.night ? 275 : 410, now, 0.24);
      tracks.gain.setTargetAtTime(0.15 * throttle, now, 0.08);
      tracks.filter.frequency.setTargetAtTime(330 + 770 * throttle, now, 0.10);
      motor.gain.setTargetAtTime(0.095 * throttle, now, 0.06);
      motor.pitch.setTargetAtTime(49 + 46 * throttle, now, 0.075);
      motor.filter.setTargetAtTime(124 + 165 * throttle, now, 0.12);
    }

    function tone(frequency, endFrequency, start, duration, volume, type = "sine") {
      const oscillator = context.createOscillator();
      const envelope = context.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, start);
      oscillator.frequency.exponentialRampToValueAtTime(endFrequency, start + duration);
      envelope.gain.setValueAtTime(0.0001, start);
      envelope.gain.exponentialRampToValueAtTime(volume, start + Math.min(0.023, duration * 0.3));
      envelope.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(envelope);
      envelope.connect(master);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.012);
    }

    function burst(frequency, start, duration, volume, type = "bandpass") {
      const voice = noise(type, frequency);
      voice.gain.setValueAtTime(0.0001, start);
      voice.gain.exponentialRampToValueAtTime(volume, start + 0.012);
      voice.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      voice.source.start(start, 0.85);
      voice.source.stop(start + duration + 0.012);
    }

    function steps(notes, start, interval, volume) {
      notes.forEach((note, i) => tone(note, note, start + i * interval, interval * 2.1, volume));
    }

    function play(cue) {
      if (muted || !motor || context.state !== "running" || !cue) return;
      const now = context.currentTime + 0.008;
      const gap = cue === "refine" || cue === "harvest" ? 2.7 : cue === "denied" ? 0.45 : 0.25;
      if (now - (lastCue.get(cue) ?? -Infinity) < gap) return;
      lastCue.set(cue, now);

      switch (cue) {
        case "ice":
          burst(1800, now, 0.14, 0.19);
          steps([730, 1090], now + 0.025, 0.075, 0.085);
          break;
        case "ore":
          burst(740, now, 0.21, 0.27);
          tone(170, 91, now + 0.025, 0.16, 0.16, "triangle");
          break;
        case "unload":
          tone(128, 61, now, 0.18, 0.20, "triangle");
          burst(490, now + 0.047, 0.13, 0.24);
          steps([490, 650], now + 0.095, 0.09, 0.09);
          break;
        case "build":
          burst(1380, now, 0.09, 0.20);
          tone(112, 67, now + 0.065, 0.18, 0.16, "triangle");
          steps([392, 524, 658], now + 0.115, 0.075, 0.105);
          break;
        case "clean":
          burst(2450, now, 0.34, 0.19, "highpass");
          tone(630, 820, now + 0.105, 0.15, 0.074);
          break;
        case "activate":
          steps([420, 640], now, 0.065, 0.09);
          break;
        case "refine":
          tone(510, 570, now, 0.11, 0.072);
          break;
        case "harvest":
          steps([554, 740], now, 0.10, 0.085);
          break;
        case "delivery":
        case "survey":
          steps([440, 590, 740], now, 0.09, 0.10);
          break;
        case "achievement":
          steps([392, 494, 587, 784], now, 0.12, 0.15);
          tone(196, 196, now, 0.56, 0.12);
          break;
        case "forecast":
          steps([390, 475, 390, 475], now, 0.17, 0.16);
          break;
        case "storm":
          burst(420, now, 0.48, 0.24, "lowpass");
          tone(123, 53, now, 0.60, 0.15, "triangle");
          break;
        case "clear":
          steps([415, 554, 622], now, 0.115, 0.095);
          break;
        case "setback":
        case "defeat":
          steps([294, 247, 187], now, 0.16, 0.14);
          break;
        case "victory":
          steps([392, 494, 587, 784, 988], now, 0.15, 0.17);
          steps([196, 247, 294], now + 0.075, 0.22, 0.095);
          break;
        case "denied":
          tone(174, 132, now, 0.105, 0.075, "triangle");
          break;
      }
    }

    return { unlock, toggle, mix, play, get muted() { return muted; } };
  }

  if (typeof module === "object" && module.exports) module.exports = { createSoundscape };
  else globalThis.TerraformiaSound = { createSoundscape };
}());

</script>
  <script>
(function () {
  "use strict";
  const E = globalThis.TerraformiaEngine;
  const G = globalThis.TerraformiaGuidance;
  const $ = id => document.getElementById(id);
  const renderer = globalThis.TerraformiaRender.createRenderer($("map"),$("minimap"));
  const sound = globalThis.TerraformiaSound.createSoundscape();
  const KEY = "terraformia:campaign:1";
  const FORMAT = new Intl.NumberFormat("ru-RU",{maximumFractionDigits:1});
  const TYPES = Object.keys(E.TYPES);
  const SHORT = ["Панель","АКБ","Цех","Сектор","Ферма","Жильё","Тепло"];
  const directions = new Set(["KeyW","ArrowUp","KeyA","ArrowLeft","KeyS","ArrowDown","KeyD","ArrowRight"]);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const keys = new Set();
  let state = E.newGame();
  let mode = "title", returnMode = "title", selected = null, hover = null, build = null, plan = null;
  let pointer = null;
  let baseId = "city", tab = "status", droneId = null, follow = true, focus = {x:11.5,y:15.5};
  let storageIssue = false, bodyContent = "", toastUntil = 0, lastFrame = 0, remainder = 0, lastUI = 0, firstFrame = true;
  let panelPressed = false;
  let guideInfo = null, achievementUntil = 0;
  let timeRate = 1;
  let attempt = readSaves();

  const preview = (() => {
    const world = E.newGame();
    world.rover = {x:12.04,y:16.67,cargo:{ice:0,ore:0},angle:-.82};
    world.crew = true;
    const installations = [[11,14,"sector","greenhouse"],[12,14,"sector","habitat"],[12,15,"sector","habitat"],
      [13,14,"sector","greenhouse"],[10,14,"solar"],[10,13,"solar"],[11,13,"battery"],[12,13,"refinery"]];
    world.bases[0].charge=14;
    world.bases[0].telemetry.capacity=16;
    world.bases[0].buildings = installations.map(([x,y,type,room])=>({x,y,type,powered:true,room:room?{type:room,powered:true,occupied:room==="habitat",progress:24}:null}));
    return world;
  })();

  function readSaves() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return {};
      const saved = JSON.parse(raw);
      if (!E.validateState(saved.progress)) throw new Error("invalid save");
      if (!E.validateState(saved.checkpoint)) saved.checkpoint = null;
      return saved;
    } catch {
      storageIssue = true;
      return {};
    }
  }

  function save({ checkpoint = false, reset = false } = {}) {
    if (reset) attempt = {};
    if (checkpoint) attempt.checkpoint = E.clone(state);
    attempt.progress = E.clone(state);
    try {
      localStorage.setItem(KEY, JSON.stringify(attempt));
      storageIssue = false;
    } catch {
      storageIssue = true;
      flash("Браузер не сохранил прогресс на диске. Текущая игра доступна в этой вкладке.", "error", 6000);
    }
  }

  const html = value => String(value ?? "").replace(/[&<>"']/g, character =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" })[character]);
  const quantity = value => FORMAT.format(Number.isFinite(value)?value:0);
  const temperature = value => `${value < 0 ? "−" : "+"}${quantity(Math.abs(value))} °C`;
  const slug = value => String(value).padStart(2,"0");
  const duration = seconds => {
    const amount = Math.max(0, Math.ceil(seconds - E.EPS));
    return `${slug(Math.floor(amount / 60))}:${slug(amount % 60)}`;
  };
  const button = (label, action, extra="", cls="") => `<button class="btn ${cls}" data-action="${action}" ${extra}>${label}</button>`;
  const at = (node, key) => Number(node.dataset[key]);
  const xy = item => `data-x="${item.x}" data-y="${item.y}"`;
  const name = id => E.location(id)?.name || "Поселение";
  const disabled = condition => condition ? " disabled" : "";
  const meter = progress => `<div class="meter" aria-hidden="true"><i style="width:${Math.max(0,Math.min(100,progress))}%"></i></div>`;

  function flash(message, kind="", lifetime=3400) {
    const node = $("toast");
    node.textContent = message;
    node.className = kind ? "toast error" : "toast";
    toastUntil = performance.now() + lifetime;
    node.hidden = false;
  }

  function setMode(value) {
    keys.clear();
    state.rover.vx = state.rover.vy = 0;
    remainder = 0;
    mode = value;
    if (mode !== "play") sound.mix(false,0,E.weather(state));
    document.body.dataset.mode = mode;
    $("layout").inert = mode !== "play";
    document.querySelector(".top").inert = mode !== "play";
    document.querySelector(".bottom").inert = mode !== "play";
    const overlay = $("overlay");
    overlay.hidden = mode === "play";
    overlay.classList.toggle("hero-mode",mode === "title");
    if (mode === "play") {
      overlay.innerHTML = "";
    } else {
      overlay.innerHTML = overlayContents();
      overlay.querySelector("button")?.focus({preventScroll:true});
    }
    renderer.size();
    if(mode==="victory") {
      for(const canvas of overlay.querySelectorAll("canvas[data-summary-base]"))renderer.settlement(canvas,state,canvas.dataset.summaryBase);
    }
    if(mode!=="play")$("interact-card").hidden=true;
    updateSoundButtons();
    redrawPanel(true);
    // Safari can suspend animation callbacks while an embedded/hidden tab is
    // being shown. Repaint immediately on entering (or returning to) the game.
    if(mode==="play"||mode==="title"&&pendingFrame)wakeFrame();
  }

  function updateSoundButtons() {
    for (const control of document.querySelectorAll('[data-action="sound"]')) {
      control.setAttribute("aria-pressed", String(!sound.muted));
      control.title = sound.muted ? "Включить звуки игры" : "Выключить звуки игры";
      if (control.closest("#overlay")) control.textContent = sound.muted ? "Звук выключен" : "Звук включён";
    }
  }

  function overlayContents() {
    if (mode === "title") {
      return `<div class="hero"><div class="subheading">МАРСИАНСКАЯ ЭКСПЕДИЦИЯ</div>
        <h1 id="dialog-title">Terraformia</h1>
        <p>Ты управляешь ровером TERRA‑01. Преврати посадочную площадку в обитаемый город и проведи две колонии через большую пыльную бурю.</p>
        <div class="actions">${attempt.progress ? button("Продолжить","continue","","btn-primary") : ""}
          ${button(attempt.progress?"Новая игра":"Начать экспедицию","new","",attempt.progress?"":"btn-primary")}
          ${button("Управление","help")}${button("Звук игры","sound")}</div>
        <p class="keys">${storageIssue ? "Последнее сохранение недоступно. Можно начать новую кампанию." : "<kbd>WASD</kbd> или стрелки · <kbd>E</kbd> действие рядом · мышь для строительства"}</p></div>`;
    }
    if (mode === "help") {
      return dialog("УПРАВЛЕНИЕ","Как играть",
